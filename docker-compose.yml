services:
  postgres:
    image: postgres:16-alpine
    container_name: mybus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mybus
      POSTGRES_USER: mybus
      POSTGRES_PASSWORD: mybus_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mybus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

